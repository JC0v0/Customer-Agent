name: build-windows

# Windows 安装包构建：
#   - 手动触发（workflow_dispatch）
#   - 推送 v* 标签时触发并发布 Release
# 产物：Agent-Customer-Setup-<version>.exe（Inno Setup 单文件安装程序，免管理员）

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write  # 发布 Release 需要

jobs:
  build:
    runs-on: windows-latest
    env:
      # GitHub Windows runners may default Python stdout/stderr to cp1252.
      # Keep CI output compatible with the repository's UTF-8 messages.
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # 拉全量历史与 tag，git describe 读版本号需要

      - name: 安装 uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: 创建虚拟环境并安装依赖
        run: |
          uv venv --python 3.11 .venv
          uv sync

      - name: 运行语法与回归检查
        run: |
          .venv\Scripts\python.exe -m compileall -q Agent Channel Message bridge core database service ui utils
          .venv\Scripts\python.exe -m unittest discover -v
          .venv\Scripts\python.exe -m pytest -q

      - name: 安装 Inno Setup 6
        shell: pwsh
        run: |
          winget install --id JRSoftware.InnoSetup -e --silent `
            --accept-package-agreements --accept-source-agreements

      - name: 构建 onedir + 安装程序
        run: .venv\Scripts\python.exe scripts\build_win_exe.py --clean
        env:
          # tag 触发时 github.ref_name 即版本号（如 v1.3）；脚本会去掉前导 v
          APP_VERSION: ${{ github.ref_name }}

      - name: 上传安装程序 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Agent-Customer-Setup
          path: dist\installer\*.exe
          if-no-files-found: error

      - name: 打标签时发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist\installer\*.exe
          generate_release_notes: true
